{% extends "base.html" %} {% block content %}

<div style="max-width: 700px; margin: 0 auto">
    <div
        style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        "
    >
        <div>
            <h2 style="color: #111827">Edit Complaint</h2>
            <p style="color: #6B7280">{{ complaint.complaint_id }} — Admin only</p>
        </div>
        <a
            href="{{ url_for('complaint.view_complaint', cmp_id=complaint.complaint_id) }}"
            style="color: #3B82F6; text-decoration: none"
            >← Cancel</a
        >
    </div>

    <div
        style="
            background: #FEF3C7;
            border-left: 4px solid #D97706;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #92400E;
        "
    >
        ⚠️ You are editing as Admin. All changes will be permanently logged. If
        complaint text is changed, AI will auto re-classify.
    </div>

    <div class="form-section">
        <form
            method="POST"
            action="{{ url_for('complaint.edit_complaint', cmp_id=complaint.complaint_id) }}"
        >
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input
                        type="text"
                        name="complainant_name"
                        required
                        value="{{ complaint.complainant_name }}"
                    />
                </div>
                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input
                        type="text"
                        name="mobile"
                        required
                        value="{{ complaint.mobile }}"
                    />
                </div>
            </div>

            <div class="form-group">
                <label>Amount Involved (Rs.)</label>
                <input
                    type="number"
                    name="amount_involved"
                    value="{{ complaint.amount_involved or 0 }}"
                />
            </div>

            <div class="form-group">
                <label>Complaint Description *</label>
                <textarea name="complaint_text" required rows="8">
{{ complaint.complaint_text }}</textarea
                >
            </div>

            <div style="display: flex; gap: 12px; margin-top: 8px">
                <button
                    type="submit"
                    class="btn-primary"
                    style="width: auto; padding: 12px 32px"
                >
                    Save Changes
                </button>
                <a
                    href="{{ url_for('complaint.view_complaint', cmp_id=complaint.complaint_id) }}"
                    style="
                        padding: 12px 24px;
                        border: 1px solid #ccc;
                        border-radius: 6px;
                        text-decoration: none;
                        color: #444;
                    "
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
